<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Zatun | Links</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <main class="container">

        <!-- =========================
             PERFIL
        ========================== -->

        <section class="profile">

            <!-- FOTO -->
            <div class="avatar-container">

                <img
                    src="fotos/perfil.webp"
                    class="avatar"
                    alt="Foto de perfil do Zatun"
                >

            </div>


            <!-- NOME -->
            <h1>Zatun</h1>


            <!-- DESCRIÇÃO -->
            <p class="description">
                Oi, eu sou Zatun! 🎮<br>
                Jogo diversos jogos, entra aí pra nós bater um papo.
            </p>


            <!-- STATUS -->
            <div class="live-status">

                <span class="live-dot"></span>

                <span>
                    Ao vivo? Cola na live!
                </span>

            </div>

        </section>


        <!-- =========================
             LINKS
        ========================== -->

        <section class="links">


            <!-- TWITCH -->
            <a
                href="https://www.twitch.tv/zatun047?sr=a"
                target="_blank"
                rel="noopener noreferrer"
                class="link-card twitch"
            >

                <div class="icon">

                    <img
                        src="fotos/twitch.webp"
                        alt="Twitch"
                    >

                </div>


                <div class="link-info">

                    <strong>
                        Twitch
                    </strong>

                    <small>
                        Me acompanhe na Twitch
                    </small>

                </div>


                <div class="arrow">
                    ↗
                </div>

            </a>


            <!-- TIKTOK -->
            <a
                href="https://www.tiktok.com/@leving047?_r=1&_t=ZS-9A98YnlT3RN"
                target="_blank"
                rel="noopener noreferrer"
                class="link-card tiktok"
            >

                <div class="icon">

                    <img
                        src="fotos/tiktok.webp"
                        alt="TikTok"
                    >

                </div>


                <div class="link-info">

                    <strong>
                        TikTok
                    </strong>

                    <small>
                        Me siga no TikTok
                    </small>

                </div>


                <div class="arrow">
                    ↗
                </div>

            </a>


            <!-- INSTAGRAM -->
            <a
                href="https://www.instagram.com/rianporto047?stkn=MXc0eTB3eHNmcGdkZg=="
                target="_blank"
                rel="noopener noreferrer"
                class="link-card instagram"
            >

                <div class="icon">

                    <img
                        src="fotos/instagram.webp"
                        alt="Instagram"
                    >

                </div>


                <div class="link-info">

                    <strong>
                        Instagram
                    </strong>

                    <small>
                        Me siga no Instagram
                    </small>

                </div>


                <div class="arrow">
                    ↗
                </div>

            </a>

        </section>


        <!-- =========================
             RODAPÉ
        ========================== -->

        <footer class="footer">

            <span>
               
            </span>

        </footer>

    </main>


    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>

</html>
